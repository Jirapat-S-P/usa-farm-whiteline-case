<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4;
    --bg-card:#ffffff;
    --text:#2a2420;
    --text-muted:#6b6058;
    --border:#e4ddd2;
    --accent:#8a6d3b;
    --accent-strong:#6b4f26;
    --link:#8a4b2f;
    --callout-bg:#fdf3e0;
    --callout-border:#e0b366;
    --code-bg:#f1ece0;
    --table-head-bg:#efe6d4;
    --table-stripe:#faf6ec;
    --shadow:0 1px 3px rgba(60,45,20,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1814;
      --bg-card:#252019;
      --text:#ece5d8;
      --text-muted:#b3a691;
      --border:#3c342a;
      --accent:#d9b877;
      --accent-strong:#e8cb92;
      --link:#e2a077;
      --callout-bg:#2e2718;
      --callout-border:#7a5c2e;
      --code-bg:#2a251d;
      --table-head-bg:#332c21;
      --table-stripe:#221e17;
      --shadow:0 1px 3px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1814;
    --bg-card:#252019;
    --text:#ece5d8;
    --text-muted:#b3a691;
    --border:#3c342a;
    --accent:#d9b877;
    --accent-strong:#e8cb92;
    --link:#e2a077;
    --callout-bg:#2e2718;
    --callout-border:#7a5c2e;
    --code-bg:#2a251d;
    --table-head-bg:#332c21;
    --table-stripe:#221e17;
    --shadow:0 1px 3px rgba(0,0,0,0.3);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Sarabun','Leelawadee UI','Tahoma',system-ui,sans-serif;
    font-size:16px;
    line-height:1.75;
  }
  .page{
    max-width:900px;
    margin:0 auto;
    padding:2.5rem 1.5rem 5rem;
  }
  .doc{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:2.5rem 2.5rem 3rem;
  }
  @media (max-width:640px){
    .doc{padding:1.5rem 1.25rem 2rem;}
    .page{padding:1.5rem 1rem 3rem;}
  }

  h1{
    font-size:1.65rem;
    font-weight:700;
    line-height:1.4;
    color:var(--accent-strong);
    margin:0 0 0.75rem;
    border-bottom:3px solid var(--accent);
    padding-bottom:1rem;
  }
  h2{
    font-size:1.3rem;
    font-weight:700;
    color:var(--accent-strong);
    margin:2.75rem 0 1rem;
    padding-top:0.25rem;
    scroll-margin-top:1rem;
  }
  h2:first-of-type{margin-top:1.5rem;}
  h3{
    font-size:1.1rem;
    font-weight:600;
    color:var(--text);
    margin:2rem 0 0.75rem;
  }
  p{margin:0.75rem 0;}
  a{color:var(--link); text-decoration:underline; text-decoration-color:color-mix(in srgb, var(--link) 40%, transparent);}
  a:hover{text-decoration-color:var(--link);}

  hr{
    border:none;
    border-top:1px solid var(--border);
    margin:2.5rem 0;
  }

  ol, ul{padding-left:1.5rem; margin:0.75rem 0;}
  li{margin:0.35rem 0;}
  ol > li > a{font-size:0.98rem;}

  blockquote{
    background:var(--callout-bg);
    border-left:4px solid var(--callout-border);
    border-radius:6px;
    margin:1.25rem 0;
    padding:0.9rem 1.25rem;
    color:var(--text);
  }
  blockquote p{margin:0.4rem 0;}

  code{
    font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    background:var(--code-bg);
    padding:0.15em 0.4em;
    border-radius:4px;
    font-size:0.9em;
  }
  pre{
    background:var(--code-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:1rem 1.25rem;
    overflow-x:auto;
    line-height:1.55;
  }
  pre code{
    background:none;
    padding:0;
    font-size:0.85rem;
    white-space:pre;
  }

  .table-wrap{
    overflow-x:auto;
    margin:1.25rem 0;
    border:1px solid var(--border);
    border-radius:8px;
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width:520px;
    font-size:0.92rem;
  }
  thead th{
    background:var(--table-head-bg);
    color:var(--accent-strong);
    text-align:left;
    padding:0.65rem 0.85rem;
    border-bottom:2px solid var(--border);
    white-space:nowrap;
  }
  tbody td{
    padding:0.6rem 0.85rem;
    border-bottom:1px solid var(--border);
    vertical-align:top;
  }
  tbody tr:nth-child(even){background:var(--table-stripe);}
  tbody tr:last-child td{border-bottom:none;}

  strong{color:var(--text); font-weight:700;}

  .meta{
    color:var(--text-muted);
    font-size:0.92rem;
  }

  .print-note{
    text-align:center;
    color:var(--text-muted);
    font-size:0.82rem;
    margin-top:2rem;
  }

  @media print{
    body{background:#fff;}
    .doc{box-shadow:none; border:none;}
    .tabbar{display:none;}
  }

  .tabbar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    justify-content:center;
    gap:0.5rem;
    padding:0.75rem 1rem;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .tabbar a{
    text-decoration:none;
    color:var(--text-muted);
    font-size:0.92rem;
    font-weight:600;
    padding:0.5rem 1.1rem;
    border-radius:999px;
    border:1px solid transparent;
  }
  .tabbar a.active{
    color:var(--accent-strong);
    background:var(--bg-card);
    border-color:var(--border);
    box-shadow:var(--shadow);
  }
  .tabbar a:not(.active):hover{
    color:var(--text);
    border-color:var(--border);
  }
</style>
</head>
<body>
<nav class="tabbar">
  <a href="usa-farm-whiteline-case-report.html" class="active">📄 รายงานฉบับเต็ม</a>
  <a href="usa-farm-whiteline-case-presentation.html">🖥️ สไลด์นำเสนอ</a>
</nav>
<div class="page">
<div class="doc">
{{CONTENT}}
</div>
<p class="print-note">{{FOOTER_NOTE}}</p>
</div>
</body>
</html>
